services:
  # FastAPI REST API & Agent Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - ALLOW_MISSING_CREDENTIALS=true
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/credential.json:/app/credential.json
      - ./backend/token.json:/app/token.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network

  # React Web App & Nginx Reverse Proxy Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
